name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      S3_BUCKET_NAME: brillianics.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets (long cache)
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".vscode/*" \
            --exclude ".DS_Store" \
            --exclude "README.md" \
            --exclude "*.html" \
            --exclude "images/banner.mp4" \
            --exclude "images/banner1.mp4" \
            --exclude "images/banner.webm" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML (no cache)
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --exclude "*" \
            --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp index.html s3://${{ env.S3_BUCKET_NAME }}/index.html \
            --region ${{ env.AWS_REGION }} \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=0, must-revalidate"
